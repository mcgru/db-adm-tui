- id: "1"
  title: Foundation and TUI shell
  description: >-
    Create the Go module, static build path, Bubble Tea root model, Nightshift
    theme, 80x24 layout, keymap aliases, and terminal-too-small state. Covers
    CAP-9 and the build foundation of CAP-10.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    No database drivers yet; use fakes. Build golden 80x24 views and test the
    Latin/Cyrillic keymap aliases before adding engine code.

- id: "2"
  title: "Connection setup: profiles, import, new connection"
  description: >-
    Implement the profile picker, JSON profile store, ~/.pgpass and ~/.mongo.*
    import, new no-password URI, and connect-time password resolution. Covers
    CAP-1.
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    Verify pgpass 0600 and PGPASSFILE behavior; assert no password reaches the
    profile file, history, argv, or error output. A saved profile without a
    source pointer prompts once per connect.

- id: "3"
  title: Common tree and Security
  description: >-
    Implement catalog adapters for PostgreSQL, MySQL/MariaDB, and MongoDB, the
    common tree with Security, access markers, and PostgreSQL database
    switching. Covers CAP-2.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Use Catalog.OrderKey for paging order; MongoDB defaults to _id. Lazy load
    children and keep failures attached to the parent.

- id: "3b"
  title: Object details and statistics
  description: >-
    Implement estimated count, size, indexes, sampled MongoDB structure, and
    cancellable exact count in the Details tab. Covers CAP-3.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Estimates must never render as 0 when unavailable; views/sequences show the
    v1 placeholder only. Section failures degrade independently.

- id: "4"
  title: Data browsing and paging
  description: >-
    Implement paged table/collection browsing with the offset window and grid.
    Covers the browsing half of CAP-4.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Enforce the 10,000-row/64 MB window and the end-of-data gesture. No sorting
    or editing.

- id: "4b"
  title: Data search and case mode
  description: >-
    Implement the `/` buffer filter, `n`/`N` match navigation, `Ctrl+F`
    server-side regexp on the focused field, and session-wide case mode. Covers
    the search half of CAP-4.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    `/` is local to loaded rows; `Ctrl+F` is server-side on the focused field.
    Preserve the previous view on errors and cancellation.

- id: "5"
  title: Query bar, Results, completion, and history
  description: >-
    Implement the query bar, SQL/MQL execution, completion, context help,
    history, and the Results tab for rows and errors. Covers CAP-6.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    MQL is limited to find/aggregate/count/distinct; no arbitrary JavaScript or
    multi-statement input. An open Results cursor holds the session lease until
    Esc; errors preserve the statement.

- id: "6"
  title: Read-only guard and mode switch
  description: >-
    Implement the conservative statement guard, read-only default, session
    read-only settings, mode switch, and warnings. Covers CAP-7.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Fuzz the SQL tokenizer and Mongo classifier. PostgreSQL/MySQL set the
    session read-only; MongoDB is guard-only. Blocked statements never reach
    the engine; the guard is not a security boundary.

- id: "7"
  title: Privilege inspection
  description: >-
    Implement native privilege readers and the Privileges tab for connected
    users, objects, users, and roles. Covers CAP-5.
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    Keep native terms; separate direct and via-role grants; mark PostgreSQL
    INHERIT FALSE as requiring SET ROLE; MySQL granted/active roles differ;
    MongoDB inherited roles/privileges render. No GRANT/REVOKE in v1.

- id: "8"
  title: Security hardening and release
  description: >-
    Harden redaction, ANSI sanitization, history rotation, contract and fuzz
    tests, and the static release build. Covers CAP-8 and the release side of
    CAP-10.
  spec_checkpoint: false
  done_checkpoint: true
  invoke_dev_with: >-
    Run the credential-leak test, ANSI injection test, and history rotation
    test. Build CGO_ENABLED=0 binaries for linux amd64/arm64 and verify no
    daemon, listening port, or telemetry.

- id: "9"
  title: "Structured write operations: users, access roles, and rows (v2)"
  description: >-
    Add contextual + / - actions for native users, access roles/grants, and
    rows or documents. Every action requires read-write mode and an explicit
    confirmation; native terms and engine-specific scope are preserved.
  v2: true
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Implement 9a rows, 9b roles/grants, and 9c users. All three are unavailable
    in r/o and must refuse mutations with the mode-switch hint. Cover
    PostgreSQL, MySQL/MariaDB, and MongoDB. Keep native terms; do not invent a
    cross-engine "user in database" model. Amend the v1 PRD/FR-40 and the
    read-only-source invariant before coding. Use ~/.pgpass and ~/.mypass with
    HOST:PORT:DBNAME:USER:PASSWORD lines; DBNAME "*" matches every database.
    Use ~/.mongo.USER-in-DB files with full mongodb:// URIs. Comment the old
    matching entry, append the new one, offer the save-as-profile prompt, and
    audit through existing history. The two matrices (Principal×Role and
    Principal/Role×Object) are opened by Ctrl+X Ctrl+R and use structured
    matrix data from the adapters. Rows support single-row insert/delete from
    the Data tab only: a SQL column form with val/NULL/DEFAULT modes, a Mongo
    extended-JSON editor, and primary key/_id identity; missing or unsafe keys
    block deletion. Refresh Data and audit every successful mutation. The
    current account must be the admin; do not switch or impersonate the target
    user. Keep native errors and verify against the live-test stack when it is
    available.
